name: User Service CI

on:
  push:
    branches: [dev, main, user-service, "user-service_*", "feature/**"]
    paths:
      - "user-service/**"
      - "pom.xml"
      - ".github/workflows/user-service-ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "user-service/**"
      - "pom.xml"
      - ".github/workflows/user-service-ci.yml"

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -pl user-service -am clean package -DskipTests -B

      - name: Test
        run: mvn -pl user-service -am verify -B

      - name: SonarQube analysis
        if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          mvn -pl user-service -am sonar:sonar -B
          -Dsonar.projectKey=inno-project-user-service
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  docker-image:
    runs-on: ubuntu-latest
    needs: build-test-analyze
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: user-service/Dockerfile
          push: false
          tags: user-service:${{ github.sha }}
          outputs: type=docker,dest=/tmp/user-service-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service-docker-image
          path: /tmp/user-service-image.tar
